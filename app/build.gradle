plugins {
    id 'com.android.application'
}

// Signing key is provided privately via the GitHub Actions secret
// YUNGATUBE_SIGNING_BUNDLE. Never commit the JKS or the secret to this repo.
def signingSecret = System.getenv('YUNGATUBE_SIGNING_BUNDLE')
def stableSigning = null
if (signingSecret != null && !signingSecret.trim().isEmpty()) {
    def bundle = new groovy.json.JsonSlurper().parseText(signingSecret)
    if (!bundle.keystore_base64 || !bundle.password || bundle.alias != 'yungatube') {
        throw new GradleException('YUNGATUBE_SIGNING_BUNDLE is incomplete or invalid')
    }
    def tempDir = System.getenv('RUNNER_TEMP') ?: System.getProperty('java.io.tmpdir')
    def keystore = new File(tempDir, 'yungatube-stable-signing.jks')
    keystore.bytes = java.util.Base64.getDecoder().decode(bundle.keystore_base64)
    stableSigning = [file: keystore, password: bundle.password.toString(),
                     alias: bundle.alias.toString()]
}

android {
    namespace 'com.yunga.yungatube'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yunga.yungatube'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.3.3'
    }

    signingConfigs {
        if (stableSigning != null) {
            permanent {
                storeFile stableSigning.file
                storePassword stableSigning.password
                keyAlias stableSigning.alias
                keyPassword stableSigning.password
                storeType 'pkcs12'
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        // Debug uses an EPHEMERAL key on each GitHub runner. It is for
        // testing only and intentionally installs as a separate app.
        debug {
            applicationIdSuffix '.prueba'
            manifestPlaceholders = [appLabel: 'YungaTube Prueba']
        }
        // Stable identity and certificate are both required for updates.
        // Distinct package ID means the OLD app is never removed.
        release {
            applicationIdSuffix '.estable'
            manifestPlaceholders = [appLabel: 'YungaTube']
            if (stableSigning != null) {
                signingConfig signingConfigs.permanent
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.4'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.4'
    implementation 'androidx.media3:media3-ui:1.9.4'
    implementation 'androidx.media3:media3-session:1.9.4'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
