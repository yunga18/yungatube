name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Comprobar configuración de firma estable
        id: signing
        if: github.event_name != 'pull_request'
        env:
          SIGNING_BUNDLE: ${{ secrets.YUNGATUBE_SIGNING_BUNDLE }}
        shell: bash
        run: |
          if [[ -n "$SIGNING_BUNDLE" ]]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Para generar un APK estable, configura el secret YUNGATUBE_SIGNING_BUNDLE en Settings > Secrets and variables > Actions"
          fi

      - name: Compilar APK de prueba (no actualizable)
        run: gradle --no-daemon :app:assembleDebug

      - name: Verificar firma y paquete de prueba
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep '^package:'

      - name: Subir APK de prueba separada
        uses: actions/upload-artifact@v4
        with:
          name: YungaTube-PRUEBA-no-actualizable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Regression test of the release signing pipeline using a disposable key.
      # The disposable release is NOT uploaded or distributed to users.
      - name: Probar compilación release con firma temporal (no distribuir)
        if: steps.signing.outputs.ready == 'no'
        shell: bash
        run: |
          export TEST_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/disposable-signing.jks" \
            -alias yungatube -keyalg RSA -keysize 2048 -validity 7 \
            -dname "CN=YungaTube Release Signing CI Test" \
            -storepass "$TEST_PASS" -keypass "$TEST_PASS" >/dev/null
          export YUNGATUBE_SIGNING_BUNDLE="$(python3 -c 'import os,json,base64,pathlib;print(json.dumps({"keystore_base64":base64.b64encode(pathlib.Path(os.environ["RUNNER_TEMP"]+"/disposable-signing.jks").read_bytes()).decode(),"password":os.environ["TEST_PASS"],"alias":"yungatube"}))')"
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep '^package:'
          rm -f "$RUNNER_TEMP/disposable-signing.jks" "$RUNNER_TEMP/yungatube-stable-signing.jks"
          echo "::notice::Release signing test passed. The test APK will NOT be published."

      - name: Compilar APK estable firmada
        if: steps.signing.outputs.ready == 'yes'
        env:
          YUNGATUBE_SIGNING_BUNDLE: ${{ secrets.YUNGATUBE_SIGNING_BUNDLE }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verificar firma de APK estable
        if: steps.signing.outputs.ready == 'yes'
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep '^package:'

      - name: Subir APK estable
        if: steps.signing.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: YungaTube-firma-estable
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
